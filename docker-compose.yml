services:
  postgres-db:
    image: postgres:15-alpine
    container_name: fit_app_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-fit_tracker_db}
      POSTGRES_USER: ${DB_USER:-fit_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fit_password}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fit_user} -d ${DB_NAME:-fit_tracker_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: